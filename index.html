<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой первый спиннер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .game-zone {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 200px;
        }

        .option {
            position: absolute;
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }
        .top    { top: 0; left: 50%; transform: translateX(-50%); }
        .right  { top: 50%; right: 0; transform: translateY(-50%); }
        .bottom { bottom: 0; left: 50%; transform: translateX(-50%); }
        .left   { top: 50%; left: 0; transform: translateY(-50%); }

        /* Наша стрелка */
        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 100px;
            background-color: #ff4757;
            border-radius: 10px;
            margin-top: -50px;
            margin-left: -10px;
            transition: transform 3s ease-out; 
        }

        .btn {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #2ed573;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover { background-color: #26af5f; }
    </style>
</head>
<body>

    <div class="game-zone">
        <!-- Ваши варианты уже на месте! -->
        <div class="option top">Играть в доту</div>
        <div class="option right">Делать уроки</div>
        <div class="option bottom">Идти гулять</div>
        <div class="option left">Спать</div>

        <!-- Стрелка -->
        <div class="spinner" id="arrow"></div>
    </div>

    <button class="btn" onclick="spin()">Крутить!</button>

    <script>
        let currentRotation = 0;

        function spin() {
            const randomDegrees = Math.floor(Math.random() * 2000) + 1000;
            currentRotation += randomDegrees;
            
            // Заменили бэктики на обычное сложение строк, так надежнее для новичка
            document.getElementById('arrow').style.transform = 'rotate(' + currentRotation + 'deg)';
        }
    </script>

</body>
</html>
